<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>witness</title>
<style>
  :root { color-scheme: light dark; }
  body { width: 320px; margin: 0; padding: 14px; font: 13px/1.5 -apple-system, system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  #domain { color: #666; margin-bottom: 8px; word-break: break-all; }
  #tier { font-size: 11px; color: #888; margin-bottom: 6px; }
  #tier:empty { display: none; }
  #status { padding: 8px 10px; border-radius: 4px; font-weight: 600; margin-bottom: 10px; }
  #status.pass { background: #e6f4ea; color: #1e7a34; }
  #status.fail { background: #fce8e6; color: #b3261e; }
  #status.unverified { background: #fff4e5; color: #966a00; }
  #observed { margin: 0; padding-left: 18px; font-family: ui-monospace, monospace; font-size: 12px; color: #444; }
  #observed:empty::before { content: "no third-party requests observed yet"; font-family: inherit; color: #999; }
  #observed li.unexpected { color: #b3261e; font-weight: 600; }
  #observed li.unexpected::after { content: " — not in allow-list"; font-weight: 400; color: #b3261e; opacity: 0.8; }

  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: #888; margin: 14px 0 4px; }
  #history { margin: 0; padding-left: 18px; font-size: 12px; color: #444; }
  #history:empty::before { content: "no earlier checks recorded for this site"; padding-left: 0; color: #999; }
  #history li.fail { color: #b3261e; }
  #history li.pass { color: #1e7a34; }

  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #1e1e1e; }
    #domain { color: #999; }
    #tier { color: #888; }
    #status.pass { background: #16321f; color: #6fcf8b; }
    #status.fail { background: #3a1a17; color: #ff8a80; }
    #status.unverified { background: #3a2e0f; color: #ffcc66; }
    #observed { color: #bbb; }
    #observed:empty::before { color: #777; }
    #observed li.unexpected { color: #ff8a80; }
    #observed li.unexpected::after { color: #ff8a80; }
    h2 { color: #888; }
    #history { color: #bbb; }
    #history:empty::before { color: #777; }
    #history li.fail { color: #ff8a80; }
    #history li.pass { color: #6fcf8b; }
  }
</style>
</head>
<body>
  <h1>🔍 witness</h1>
  <div id="domain"></div>
  <div id="tier"></div>
  <div id="status">checking…</div>
  <ul id="observed"></ul>
  <h2>Recent checks</h2>
  <ul id="history"></ul>
  <script src="diff.js"></script>
  <script src="claims.js"></script>
  <script src="popup.js"></script>
</body>
</html>
